<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Registro</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="./css/style.css">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-6">

<div class="card shadow-lg">

<div class="card-body p-4">

<h2 class="text-center mb-4">
Crear Cuenta
</h2>

<form id="registroForm">

<input
type="text"
id="nombre"
class="form-control mb-3"
placeholder="Nombre"
required
>

<input
type="text"
id="apellido"
class="form-control mb-3"
placeholder="Apellido"
required
>

<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Email"
required
>

<input
type="password"
id="password"
class="form-control mb-3"
placeholder="Contraseña"
required
>

<button
class="btn btn-success w-100"
>
Registrarse
</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script
type="module"
src="./js/registro.js">
</script>

</body>

</html>
