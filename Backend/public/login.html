<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Login</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="./css/style.css">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-5">

<div class="card shadow-lg">

<div class="card-body p-4">

<h2 class="text-center mb-4">
Iniciar Sesión
</h2>

<form id="loginForm">

<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Email"
required
>

<input
type="password"
id="password"
class="form-control mb-3"
placeholder="Contraseña"
required
>

<button
class="btn btn-primary w-100"
>
Ingresar
</button>

</form>

<hr>

<a
href="/registro.html"
class="btn btn-success w-100"
>
Crear cuenta
</a>

</div>

</div>

</div>

</div>

</div>

<script
type="module"
src="./js/login.js">
</script>

</body>

</html>
